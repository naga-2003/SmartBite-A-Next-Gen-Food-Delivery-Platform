<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Invoice Details</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #f8f9fa, #e0f7fa);
            margin: 0;
            padding: 50px;
            color: #212529;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #009688;
            margin-bottom: 30px;
            border-bottom: 3px solid #009688;
            padding-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin: 15px 0;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        ul li {
            background-color: #e0f2f1;
            padding: 12px 20px;
            margin: 10px 0;
            border-left: 5px solid #009688;
            border-radius: 5px;
            font-size: 16px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            color: white;
            background-color: #009688;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #00796b;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Invoice Details</h2>

    <p><strong>Invoice ID:</strong> <span th:text="${invoice.id}"></span></p>
    <p><strong>Customer Name:</strong> <span th:text="${invoice.customerName}"></span></p>
    <p><strong>Total:</strong> $<span th:text="${invoice.totalAmount}"></span></p>

    <h3 style="color:#009688;">Items:</h3>
    <ul>
        <li th:each="item : ${invoice.items}" th:text="${item.name} + ' - $' + ${item.price}"></li>
    </ul>

    <a href="/orders">⬅ Back to Orders</a>
</div>
</body>
</html>
